name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - release-*

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        task: [typecheck, lint, test, build]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json

      - name: Install Deps
        run: bun ci

      - name: Run ${{ matrix.task }}
        run: bun run ${{ matrix.task }}
